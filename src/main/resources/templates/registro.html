<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3">Crear cuenta</h3>
                    <form th:action="@{/registro}" th:object="${registroDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input class="form-control" th:field="*{nombre}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select class="form-select" th:field="*{rol}">
                                <option th:value="CLIENTE">CLIENTE</option>
                                <option th:value="VENDEDOR">VENDEDOR</option>
                            </select>
                            <div class="form-text">El rol ADMIN solo lo asigna otro administrador desde el CRUD.</div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña</label>
                                <input class="form-control" type="password" th:field="*{password}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirmar</label>
                                <input class="form-control" type="password" th:field="*{confirmPassword}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Registrarse</button>
                    </form>
                    <hr>
                    <p class="mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
