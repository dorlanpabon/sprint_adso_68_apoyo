<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between">
        <div class="d-flex gap-2">
            <a class="navbar-brand" th:href="@{/dashboard}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/usuarios}">Usuarios</a>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger btn-sm">Salir</button>
        </form>
    </div>
</nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Listado de usuarios</h3>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios/nuevo}" class="btn btn-success">Nuevo usuario</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Activo</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombre}">Nombre</td>
                    <td th:text="${u.email}">email</td>
                    <td><span class="badge bg-secondary" th:text="${u.rol}">CLIENTE</span></td>
                    <td>
                        <span th:if="${u.activo}" class="badge bg-success">Sí</span>
                        <span th:unless="${u.activo}" class="badge bg-danger">No</span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')" class="d-flex gap-1">
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <form th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post"
                              onsubmit="return confirm('¿Eliminar usuario?')">
                            <button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center py-3">Sin usuarios registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
