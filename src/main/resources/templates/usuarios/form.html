<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${esEdicion} ? 'Editar usuario' : 'Nuevo usuario'">Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 th:text="${esEdicion} ? 'Editar usuario' : 'Nuevo usuario'">Usuario</h3>

                    <form th:if="${!esEdicion}" th:action="@{/usuarios}" th:object="${usuarioForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input class="form-control" th:field="*{nombre}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rol</label>
                                <select class="form-select" th:field="*{rol}">
                                    <option th:value="CLIENTE">CLIENTE</option>
                                    <option th:value="VENDEDOR">VENDEDOR</option>
                                    <option th:value="ADMIN">ADMIN</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Activo</label>
                                <select class="form-select" th:field="*{activo}">
                                    <option th:value="true">Sí</option>
                                    <option th:value="false">No</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input class="form-control" type="password" th:field="*{password}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success" type="submit">Guardar</button>
                            <a th:href="@{/usuarios}" class="btn btn-secondary">Volver</a>
                        </div>
                    </form>

                    <form th:if="${esEdicion}" th:action="@{/usuarios/{id}(id=${usuarioForm.id})}" th:object="${usuarioForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input class="form-control" th:field="*{nombre}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rol</label>
                                <select class="form-select" th:field="*{rol}">
                                    <option th:value="CLIENTE">CLIENTE</option>
                                    <option th:value="VENDEDOR">VENDEDOR</option>
                                    <option th:value="ADMIN">ADMIN</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Activo</label>
                                <select class="form-select" th:field="*{activo}">
                                    <option th:value="true">Sí</option>
                                    <option th:value="false">No</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña (opcional)</label>
                            <input class="form-control" type="password" th:field="*{password}" placeholder="Dejar vacío para conservar">
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-warning" type="submit">Actualizar</button>
                            <a th:href="@{/usuarios}" class="btn btn-secondary">Volver</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
