<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" th:href="@{/dashboard}">Dashboard</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger btn-sm">Salir (<span sec:authentication="name">user</span>)</button>
        </form>
    </div>
</nav>
<div class="container py-4">
    <div class="alert alert-success">
        Hola <strong sec:authentication="name">usuario</strong> |
        Roles: <strong sec:authentication="authorities">[ROLES]</strong>
    </div>
    <div class="row g-3">
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5>Usuarios</h5>
                    <p class="text-muted">Ver listado de usuarios del sistema.</p>
                    <a th:href="@{/usuarios}" class="btn btn-primary btn-sm">Ir al CRUD</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5>Crear usuario</h5>
                    <p class="text-muted">Solo ADMIN puede crear/editar/eliminar.</p>
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-success btn-sm">Nuevo usuario</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('CLIENTE')">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5>Zona cliente</h5>
                    <p class="text-muted">No tienes acceso al CRUD de usuarios.</p>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('VENDEDOR')">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5>Zona vendedor</h5>
                    <p class="text-muted">Puedes ver usuarios, pero no gestionarlos.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
