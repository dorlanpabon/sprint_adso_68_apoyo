<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3">Iniciar sesión</h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Email o contraseña incorrectos, o usuario inactivo.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info">
                        Sesión cerrada correctamente.
                    </div>
                    <div th:if="${param.registrado}" class="alert alert-success">
                        Cuenta creada. Ahora inicia sesión.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Email</label>
                            <input class="form-control" type="email" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Contraseña</label>
                            <input class="form-control" type="password" id="password" name="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Entrar</button>
                    </form>

                    <hr>
                    <p class="mb-0">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
                    <p class="mb-0"><a th:href="@{/}">Volver al inicio</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
